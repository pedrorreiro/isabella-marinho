<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada · Isabella Ferraz Marinho</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fefdf9">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap">
<style>
  :root{color-scheme:light;--surface:#fefdf9;--surface-sunken:#f7f1ea;--ink:#74402f;--ink-muted:#8a6b61;--rosa:#c56364;--rosa-strong:#a94a4f;--on-rosa:#fff;--rosa-100:#f8ece9;--line:#eadfd6}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:48px clamp(20px,5vw,56px);background:var(--surface);color:var(--ink);font-family:Jost,"Century Gothic","Avenir Next",system-ui,sans-serif;text-align:center;-webkit-font-smoothing:antialiased;position:relative;overflow-x:clip}
  body::before{content:"";position:absolute;left:50%;top:50%;width:min(760px,140vw);aspect-ratio:1;border-radius:50%;background:var(--surface-sunken);translate:-50% -50%;z-index:-1}
  main{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:30em}
  .logo{display:block;width:clamp(150px,30vw,210px);height:auto;margin-bottom:8px}
  .eyebrow{margin:0;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-muted)}
  h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(36px,6vw,54px);line-height:1.05;text-wrap:balance}
  h1 em{color:var(--rosa)}
  p.txt{margin:0;font-size:18px;line-height:1.7;color:var(--ink-muted)}
  .btn{display:inline-flex;align-items:center;gap:12px;margin-top:10px;padding:14px 26px;border-radius:999px;background:var(--rosa-strong);color:var(--on-rosa);font-size:14px;font-weight:500;letter-spacing:.06em;text-decoration:none;transition:box-shadow .3s}
  .btn:hover{box-shadow:0 10px 28px rgba(116,64,47,.18)}
  .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  :focus-visible{outline:2px solid var(--rosa-strong);outline-offset:3px;border-radius:999px}
  @keyframes flutuar{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
  .logo{animation:flutuar 7s ease-in-out infinite;transform-origin:50% 100%}
  @media (prefers-reduced-motion:reduce){.logo{animation:none}}
</style>
<main>
  <img class="logo" src="/img/logo-transparente.webp" width="1144" height="1374" alt="Isabella Ferraz Marinho, psicóloga e analista do comportamento.">
  <p class="eyebrow">Página não encontrada</p>
  <h1>Esse balão <em>voou para longe</em></h1>
  <p class="txt">O endereço que você procurou não existe ou mudou de lugar.</p>
  <a class="btn" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Voltar ao início</a>
</main>
